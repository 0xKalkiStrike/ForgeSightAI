version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./factoryguard.db
      - SECRET_KEY=factoryguard_amd_hackathon_super_secret_key_2026
      - AMD_GPU_ENABLED=true
      - ROCM_ENABLED=true
      - AMD_DEVICE_NAME=AMD Radeon / Instinct GPU
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
